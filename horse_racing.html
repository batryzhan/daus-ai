<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Horse Run - Sunset Field</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #ffaa33; font-family: 'Georgia', serif; font-size: 20px; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">Endless Gallop</div>
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.136.0';
        import { GLTFLoader } from 'https://esm.sh/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';

        // --- 1. Scene & Camera ---
        const scene = new THREE.Scene();
        // Fog adds depth and makes the "end" of the field look natural
        scene.fog = new THREE.Fog(0xf28b0c, 10, 60); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(8, 4, 12); // Cinematic side-view angle

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true; // Enable shadows for realism
        document.body.appendChild(renderer.domElement);

        // --- 2. Sunset Sky Background ---
        const vertexShader = `
            varying vec3 vWorldPosition;
            void main() {
                vec4 worldPosition = modelMatrix * vec4( position, 1.0 );
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
            }
        `;
        const fragmentShader = `
            varying vec3 vWorldPosition;
            void main() {
                float h = normalize( vWorldPosition + vec3(0, 15, 0) ).y;
                gl_FragColor = vec4( mix( vec3(1.0, 0.4, 0.0), vec3(0.02, 0.05, 0.2), max(pow(max(h, 0.0), 0.7), 0.0) ), 1.0 );
            }
        `;
        const skyGeo = new THREE.SphereGeometry(200, 32, 15);
        const skyMat = new THREE.ShaderMaterial({ vertexShader, fragmentShader, side: THREE.BackSide });
        scene.add(new THREE.Mesh(skyGeo, skyMat));

        // --- 3. Moving Ground (The "Endless" Trick) ---
        const groundGroup = new THREE.Group();
        scene.add(groundGroup);

        const createGroundSection = (zOffset) => {
            const geometry = new THREE.PlaneGeometry(100, 100);
            const material = new THREE.MeshStandardMaterial({ color: 0x1a2e05 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.x = zOffset;
            mesh.receiveShadow = true;
            return mesh;
        };

        // We use two planes and swap them to create an infinite loop
        const ground1 = createGroundSection(0);
        const ground2 = createGroundSection(100);
        groundGroup.add(ground1, ground2);

        // Add a grid helper to see the movement clearly
        const grid = new THREE.GridHelper(200, 40, 0xffaa00, 0x444444);
        grid.position.y = 0.01;
        groundGroup.add(grid);

        // --- 4. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffaa33, 2);
        sunLight.position.set(-10, 10, -10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- 5. Horse Setup ---
        let mixer, horse;
        const clock = new THREE.Clock();
        const loader = new GLTFLoader();

        loader.load('https://threejs.org/examples/models/gltf/Horse.glb', (gltf) => {
            horse = gltf.scene;
            horse.scale.set(0.018, 0.018, 0.018);
            horse.rotation.y = Math.PI / 2; // Face right
            horse.traverse(o => { if (o.isMesh) o.castShadow = true; });
            scene.add(horse);

            mixer = new THREE.AnimationMixer(horse);
            const action = mixer.clipAction(gltf.animations[0]);
            action.setDuration(0.6).play(); // Fast gallop
        });

        // --- 6. Animation Loop ---
        const speed = 0.3; // Speed of the world moving

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // Move the GROUND instead of the horse
            groundGroup.position.x -= speed;

            // Reset ground position for infinite loop
            if (groundGroup.position.x < -100) {
                groundGroup.position.x = 0;
            }

            // Camera looking at horse
            camera.lookAt(0, 2, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
